apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-data-platform
  namespace: supplier-data
  labels:
    app: supplier-data-platform
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: supplier-data-platform
  template:
    metadata:
      labels:
        app: supplier-data-platform
        tier: api
    spec:
      containers:
        - name: supplier-data-platform
          image: myacr.azurecr.io/supplier-data-platform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: supplier-platform-config
            - secretRef:
                name: supplier-platform-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 2
