apiVersion: v1
kind: ConfigMap
metadata:
  name: supplier-platform-config
  namespace: supplier-data
  labels:
    app: supplier-data-platform
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "sqlserver-service.database.svc.cluster.local"
