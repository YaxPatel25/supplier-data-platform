apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supplier-data-platform-ingress
  namespace: supplier-data
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - supplier-platform.company.com
      secretName: supplier-platform-tls
  rules:
    - host: supplier-platform.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supplier-data-platform-service
                port:
                  number: 80
